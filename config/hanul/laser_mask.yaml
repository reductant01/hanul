lidar_scan_mask:
  ros__parameters:
    input_topic: /scan_raw
    output_topic: /scan
    # 현재 SLLIDAR 스캔 기준 뒤쪽 가려짐이 0deg 근처
    # mask range: degree 단위, [-60deg, 60deg]를 제거하면 총 120deg가 비워진다.
    mask_lower_angle_deg: -60.0
    mask_upper_angle_deg: 60.0
    # TF보다 살짝 미래 시각으로 보이는 문제를 줄이기 위해 /scan stamp를 조금 과거로 당긴다.
    restamp_offset_sec: 0.05
    # 실로봇 S2 스캔이 너무 촘촘하면 slam_toolbox queue가 밀릴 수 있어
    # upstream에서 3개 중 1개만 /scan으로 내보낸다.
    publish_every_n: 3
